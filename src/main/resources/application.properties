spring.application.name=crud-app-with-security

# server configuration
server.port=${PORT:8080}

#####################################################################################

# 1. Database Connection
spring.datasource.url=jdbc:postgresql://ep-super-cloud-a155csn3-pooler.ap-southeast-1.aws.neon.tech/Secuware?sslmode=require&channelBinding=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Hibernate Settings for Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Handle Postgres-specific naming (Optional but recommended)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

######################################################################################

# Jwt Configurations

#default for local
app.jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
app.jwt.expiration=86400000

# jackson config
spring.jackson.deserialization.fail-on-unknown-properties=true
#spring.jackson.default-property-inclusion=non_null

# spring boot actuator config
management.endpoints.web.exposure.include=health,info,metrics,mappings,env

# Show full health details (disk space, db connection status)
management.endpoint.health.show-details=always

# Custom Info (Appears in /actuator/info)
info.app.name=Crud App With Security
info.app.description=Java Full Stack Project with JWT and JPA Auditing
info.app.version=1.0.0

# CORS Config : Default to localhost for local development
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

#set profile to dev for local h2 db props; use prod env variable during deployment to pick postgres db env
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}